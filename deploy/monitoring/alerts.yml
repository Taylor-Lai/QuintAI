groups:
  - name: quintai
    rules:
      - alert: QuintAIHighServerErrorRate
        expr: sum(rate(quintai_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: QuintAI 服务端错误持续升高
      - alert: QuintAINoTraffic
        expr: sum(rate(quintai_http_requests_total[15m])) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: QuintAI 长时间没有收到请求
