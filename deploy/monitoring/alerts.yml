groups:
  - name: huiwenrongtong
    rules:
      - alert: HuiwenRongtongHighServerErrorRate
        expr: sum(rate(huiwenrongtong_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 慧文融通服务端错误持续升高
      - alert: HuiwenRongtongNoTraffic
        expr: sum(rate(huiwenrongtong_http_requests_total[15m])) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: 慧文融通长时间没有收到请求
